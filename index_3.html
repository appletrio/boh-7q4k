<title>BOH Тренировки</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one-hand gym tool. Dark-first graphite with copper accent, steel-blue for data.
   Hero = character sheet; bottom tab bar; big tap targets for sets. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#e2e7ec; --ink:#161b22; --muted:#5b6674; --line:#d1d8df;
  --accent:#c2501a; --accent-ink:#ffffff; --steel:#2c6a99; --good:#2a8a55; --warn:#b98512;
  --heat0:#dfe4e9; --heat1:#f1c9b3; --heat2:#e39467; --heat3:#c2501a;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151a; --surface:#1a2027; --surface2:#232b34; --ink:#e8ecf0; --muted:#98a3b1; --line:#2c3541;
    --accent:#f08a4b; --accent-ink:#1b0f06; --steel:#6fb0e0; --good:#58c58a; --warn:#e0b04a;
    --heat0:#232b34; --heat1:#5a3a28; --heat2:#a8602f; --heat3:#f08a4b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#1a2027; --surface2:#232b34; --ink:#e8ecf0; --muted:#98a3b1; --line:#2c3541;
  --accent:#f08a4b; --accent-ink:#1b0f06; --steel:#6fb0e0; --good:#58c58a; --warn:#e0b04a;
  --heat0:#232b34; --heat1:#5a3a28; --heat2:#a8602f; --heat3:#f08a4b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;line-height:1.05}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:500;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:90px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:2px}
.logo{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.08em}
.logo i{font-style:normal;color:var(--accent)}
.sync{font-size:12px;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{display:flex;width:100%;max-width:720px}
.tab{flex:1;background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font-body);font-size:10px;font-weight:600;letter-spacing:-.01em;color:var(--muted);position:relative;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:25%;right:25%;top:0;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;display:block}
.ring .lv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lv b{font-family:var(--font-display);font-size:46px;line-height:1}
.ring .lv span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:44px;letter-spacing:.1em}
.rank{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat{display:grid;grid-template-columns:118px 1fr 34px;gap:10px;align-items:center;padding:5px 0}
.stat .bar>i{background:var(--steel)}
.stat b{font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.05;white-space:nowrap}
.kpi span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.heat i{aspect-ratio:1/1;border-radius:3px;background:var(--heat0);display:block}
.heat i.h1{background:var(--heat1)}.heat i.h2{background:var(--heat2)}.heat i.h3{background:var(--heat3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.badge b{font-family:var(--font-display);font-size:18px;letter-spacing:.03em;line-height:1.1}
.badge.on{border-color:var(--accent)}
.badge.on b{color:var(--accent)}
.badge.off{opacity:.8}
.badge .bar{height:5px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}

/* workout */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.ex h3{font-size:21px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);font-weight:600}
.setrow{display:grid;grid-template-columns:22px 1fr 12px 1fr 52px 44px;gap:6px;align-items:center;margin-top:8px}
.setrow .n{font-family:var(--font-mono);color:var(--muted);text-align:center}
.setrow input{text-align:center;font-family:var(--font-mono);font-size:17px}
.setrow .x{text-align:center;color:var(--muted)}
.ok{min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.del{background:none;border:0;color:var(--muted);font-size:20px;min-height:42px}
.last{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.timer{font-family:var(--font-mono);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.stagewrap{position:relative}
.stage{position:relative;width:100%;max-width:360px;aspect-ratio:340/700;margin:8px auto;border-radius:18px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 60% 38% at 50% 95%,rgba(30,150,255,.38),transparent 70%),radial-gradient(ellipse 45% 60% at 50% 40%,rgba(40,90,200,.22),transparent 75%),linear-gradient(#020615,#061636 65%,#030a1b);
  box-shadow:0 0 0 1px rgba(90,180,255,.32),0 0 34px rgba(30,120,255,.28)}
.stage::before{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:repeating-linear-gradient(90deg,rgba(70,160,255,.13) 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,rgba(70,160,255,.13) 0 1px,transparent 1px 26px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000);pointer-events:none}
.ped{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ped ellipse{fill:none;stroke:#3fc2ff;filter:drop-shadow(0 0 5px #1fa8ff)}
.ped .r0{stroke-width:1;opacity:.45}.ped .r1{stroke-width:1.6;opacity:.85}.ped .r2{stroke-width:1;opacity:.5;fill:rgba(40,160,255,.14)}
.model{position:absolute;left:50%;top:0;height:96%;aspect-ratio:340/860;transform:translateX(-50%)}
.fr{position:absolute;inset:0;will-change:transform,opacity;pointer-events:none}
.fr img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 0 10px rgba(40,150,255,.5)) saturate(1.08) contrast(1.04)}
.fov{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .25s}
.model.live .fr.act .fov{opacity:1;pointer-events:auto}
.hl{filter:blur(2.2px);mix-blend-mode:screen;opacity:0;transition:opacity .3s}
.heat-on .hl{opacity:1}
.chip[aria-pressed="true"]{border-color:#14f4ff;color:#14f4ff;box-shadow:0 0 10px rgba(20,244,255,.35)}
.hp{pointer-events:none}
.hp.h3{fill:#14f4ff;opacity:.62}.hp.h2{fill:#4f7dff;opacity:.55}.hp.h1{fill:#b14dff;opacity:.42}.hp.h0{fill:transparent}
.m{fill:transparent;stroke:transparent;stroke-width:1.4;cursor:pointer;transition:fill .15s,stroke .15s}
.m.n{cursor:default}
.m.hov{fill:rgba(20,244,255,.22);stroke:#e8ffff;filter:drop-shadow(0 0 4px #14f4ff)}
.m.sel{stroke:#b7ff2a;stroke-width:2.2;fill:rgba(183,255,42,.14);filter:drop-shadow(0 0 5px #b7ff2a)}
.m:focus-visible{outline:none;stroke:#e8ffff;stroke-width:2.4}
.sw.h0{background:#3b3f4a}.sw.h1{background:#b14dff}.sw.h2{background:#4f7dff}.sw.h3{background:#14f4ff}
.tip{position:absolute;z-index:5;pointer-events:none;background:#0a1a33;color:#dff8ff;border:1px solid #28c7ff;box-shadow:0 0 12px rgba(40,200,255,.45);padding:5px 9px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;max-width:90%}
.tip[hidden]{display:none}
.exg{padding:12px 14px}
.exh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;min-height:44px;padding:0}
.exh b{flex:1;font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.exh .rank{font-size:15px}
.exh .chev{color:var(--muted);width:14px;text-align:center}
.exlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.exlist+.btn{margin-top:10px}
.exrow{display:flex;gap:8px;align-items:stretch}
.exname{flex:1;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:48px;font-weight:600}
.exhist{flex:none;background:none;border:1px solid var(--line);border-radius:8px;padding:0 12px;color:var(--muted);font-size:13px;min-height:48px}
.grow{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:44px}
.grow:first-of-type{border-top:0}
.grow .num{text-align:right;color:var(--muted)}
.grow .bar>i{background:var(--steel)}
@media (prefers-reduced-motion:reduce){.m{transition:none}}

.picker{background:var(--surface);border:1px solid var(--steel);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.pitem{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:46px}
.pitem b{font-weight:600}
.setrow .tn{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}


/* history / records */
.sess{padding:0;overflow:hidden}
.sess>button{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:flex;gap:12px;align-items:center}
.sess .date{width:54px;text-align:center;flex:none}
.sess .date b{display:block;font-family:var(--font-display);font-size:26px;line-height:1}
.sess .date span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sess .meta{flex:1;min-width:0}
.sess .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.exl{margin-top:10px}
.exl b{font-weight:600}
.exl .sets{font-family:var(--font-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 8px;background:var(--accent);color:var(--accent-ink)}
.month{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:6px}
.rec{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.rec .nm{flex:1;min-width:0}
.rec .nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.rec .big{font-family:var(--font-display);font-size:24px;text-align:right;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:14px;fill:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl td.mono{overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw;text-align:center}
@media (max-width:420px){
  .hero{grid-template-columns:104px 1fr;gap:12px}
  .ring{width:104px;height:104px}.ring .lv b{font-size:38px}
  .hero h1{font-size:36px}
  .stat{grid-template-columns:112px 1fr 28px;font-size:14px}
}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
</style>

<div class="wrap" id="app">
  <div class="top"><div class="logo">B<i>O</i>H</div><div class="sync" id="sync"></div></div>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabbar" aria-label="Разделы"><div class="tabbar-in" id="tabs"></div></nav>

/* ---------- helpers ---------- */
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k==='class') e.className=v;
    else if (k==='text') e.textContent=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v===true) e.setAttribute(k,'');
    else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const NS='http://www.w3.org/2000/svg';
function sv(tag, props, ...kids){
  const e = document.createElementNS(NS, tag);
  if (props) for (const k in props) e.setAttribute(k, props[k]);
  for (const c of kids.flat(Infinity)){ if (c==null) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}

function allSessions(){
  const ls = db ? [] : (lsGet(LS_S) || []);

  const extra = (db ? dbSessions : ls).map(s=>({id:s.id, src:'u', d:s.d, t:s.t, ex:s.ex}));
  return h.concat(extra).sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : a.id<b.id?-1:1);

    for (const e of s.ex){
      const key = e.n.toLowerCase();
      let rec = ex.get(key);
      if (!rec){ rec = {n:e.n, g:e.g, hist:[], bestE:0, bestW:0, bestBW:0, bestWset:null, totalSets:0}; ex.set(key, rec); }
      rec.g = e.g || rec.g;
      let sE=0, sTop=null, sBW=0, sVol=0;
      for (const [w,r] of e.s){
        sets++; reps+=r; sVol += w*r;
        if (w>0){ workSets++; const x=e1(w,r); if (x>sE) sE=x; if (!sTop || w>sTop[0] || (w===sTop[0]&&r>sTop[1])) sTop=[w,r]; }
        else if (r>sBW) sBW=r;
      }
      vol += sVol;
      const metric = sE>0 ? sE : sBW, prev = sE>0 ? rec.bestE : rec.bestBW;
      const pr = rec.hist.length>0 && metric>prev+1e-9;
      if (pr) prEvents++;
      rec.hist.push({d:s.d, sid:s.id, sets:e.s, e1:sE, top:sTop, bw:sBW, vol:sVol, pr, c:e.c||null});
      if (sE>rec.bestE) rec.bestE=sE;
      if (sBW>rec.bestBW) rec.bestBW=sBW;
      if (sTop && sTop[0]>=rec.bestW){ rec.bestW=sTop[0]; rec.bestWset=sTop; }
      rec.totalSets += e.s.length;
    }
    s.vol=vol; s.sets=sets; s.reps=reps; s.workSets=workSets; s.xp = 100+Math.round(vol/50);
    totalVol += vol; xp += s.xp;
  }
  const cut28 = ymd(new Date(today.getFullYear(),today.getMonth(),today.getDate()-27));
  const n28 = sessions.filter(s=>s.d>=cut28).length;
  const cut30 = ymd(new Date(today.getFullYear(),today.getMonth(),today.getDate()-30));
  const groups = {};
  for (const g of GROUPS) groups[g]={g, vol:0, vol30:0, n:0, n30:0, last:null};
  for (const s of sessions){
    const seen=new Set();
    for (const e of s.ex){
      const G=groups[e.g]; if (!G) continue;
      const v=e.s.reduce((a,[w,r])=>a+w*r,0);
      G.vol+=v; if (s.d>=cut30) G.vol30+=v;
      if (!seen.has(e.g)){ seen.add(e.g); G.n++; if (s.d>=cut30) G.n30++; }
      if (!G.last || s.d>G.last) G.last=s.d;
    }
  }
  for (const g of GROUPS){
    const G=groups[g]; G.pts=G.vol/30;
    G.level=Math.max(1,Math.floor(Math.pow(G.pts/150,2/3)));
    G.a=150*Math.pow(G.level,1.5); G.b=150*Math.pow(G.level+1,1.5);
    G.frac=Math.max(0,Math.min(1,(G.pts-G.a)/(G.b-G.a)));
    G.days=G.last?daysBetween(pd(G.last),today):999;
  }
  // streak: weeks in a row with >= 2 sessions
  const perWeek = new Map();
  for (const s of sessions){ const k=ymd(monday(pd(s.d))); perWeek.set(k,(perWeek.get(k)||0)+1); }
  let streak=0; let wk=monday(today);
  if ((perWeek.get(ymd(wk))||0) < 2) wk.setDate(wk.getDate()-7);
  while ((perWeek.get(ymd(wk))||0) >= 2){ streak++; wk.setDate(wk.getDate()-7); }
  let bestStreak=0, cur=0;
  const keys=[...perWeek.keys()].sort();
  if (keys.length){ let w=pd(keys[0]); const end=monday(today); while (w<=end){ if ((perWeek.get(ymd(w))||0)>=2){ cur++; if (cur>bestStreak) bestStreak=cur; } else cur=0; w.setDate(w.getDate()+7); } }
  const L = levelOf(xp);
  const badges = [
    {k:'10 тренировок', v:sessions.length, g:10},
    {k:'50 тренировок', v:sessions.length, g:50},
    {k:'100 тренировок', v:sessions.length, g:100},
    {k:'100 тонн в сумме', v:totalVol/1000, g:100, u:' т'},
    {k:'Серия 4 недели', v:bestStreak, g:4, u:' нед'},
    {k:'Серия 12 недель', v:bestStreak, g:12, u:' нед'},
    {k:'25 рекордов', v:prEvents, g:25},
  ];
  M = {sessions, ex, totalVol, prEvents, xp, level:L, groups, streak, bestStreak, perWeek, badges, todayS, cut30, n28};
}

/* ---------- Telegram cloud ---------- */
const TG=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)?Telegram.WebApp:null;
const CS=(TG&&TG.CloudStorage&&typeof TG.CloudStorage.setItem==='function')?TG.CloudStorage:null;
const csCall=(fn,...a)=>new Promise(res=>{ try{ CS[fn](...a,(err,v)=>res(err?null:v)); }catch(e){ res(null); } });
async function csPut(k,v){ if (!CS) return; const s=JSON.stringify(v); if (s.length>4000) return; await csCall('setItem',k,s); }
async function csDel(k){ if (CS) await csCall('removeItem',k); }
async function tgSync(){
  if (!CS) return;
  const keys=await csCall('getKeys'); if (!keys) return;
  const sk=keys.filter(k=>k.startsWith('s_')||k==='profile');
  const items=sk.length?await csCall('getItems',sk):{};
  if (!items) return;
  let changed=false;
  const byId=new Map((lsGet(LS_S)||[]).map(s=>[s.id,s]));
  for (const k of sk){ if (k==='profile') continue; try{ const s=JSON.parse(items[k]); if (s&&s.id&&!byId.has(s.id)){ byId.set(s.id,s); changed=true; } }catch(e){} }
  for (const s of byId.values()) if (!keys.includes('s_'+s.id)) csPut('s_'+s.id,s);
  if (changed) lsSet(LS_S,[...byId.values()]);
  if (items.profile){ try{ profile=Object.assign(profile,JSON.parse(items.profile)); lsSet(LS_P,profile); changed=true; }catch(e){} }
  else if (lsGet(LS_P)) csPut('profile',profile);
  if (changed){ compute(); render(); }
}

/* ---------- storage ---------- */
function loadProfile(){ const p = lsGet(LS_P); if (p) profile = Object.assign(profile, p); }
async function saveProfile(){
  lsSet(LS_P, profile); csPut('profile',profile);
  if (db){ try { await db.doc('profile/main').set(profile); } catch(e){ toast('Не удалось сохранить в базу, профиль сохранён на этом устройстве'); } }
}
async function saveSession(s){
  if (db){ await db.collection('sessions').doc(s.id).set(s); }
  else { const ls=lsGet(LS_S)||[]; ls.push(s); lsSet(LS_S, ls); csPut('s_'+s.id,s); }
}
async function removeSession(id){
  if (db){ await db.collection('sessions').doc(id).delete(); }
  else { lsSet(LS_S, (lsGet(LS_S)||[]).filter(s=>s.id!==id)); csDel('s_'+id); }
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(n=>n.remove());
  const t = el('div',{class:'toast',role:'status'},msg); document.body.append(t);
  clearTimeout(toastId); toastId=setTimeout(()=>t.remove(), 4200);
}
function ringSvg(frac){
  const r=54, c=2*Math.PI*r;
  return sv('svg',{viewBox:'0 0 132 132','aria-hidden':'true'},
    sv('circle',{cx:66,cy:66,r:r,fill:'none',stroke:'var(--surface2)','stroke-width':10}),
    sv('circle',{cx:66,cy:66,r:r,fill:'none',stroke:'var(--accent)','stroke-width':10,'stroke-linecap':'round',
      'stroke-dasharray':(c*Math.max(0.02,Math.min(1,frac))).toFixed(1)+' '+c.toFixed(1),transform:'rotate(-90 66 66)'}));
}
function lineChart(pts, yLabel){
  const W=600,H=220,L=40,R=14,T=14,B=26;
  if (!pts.length) return el('div',{class:'muted small'},'Пока нет данных');
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys);
  if (lo===hi){ lo-=1; hi+=1; }
  const span=hi-lo; lo=Math.max(0,lo-span*0.1); hi=hi+span*0.1;
  const step=(()=>{ const raw=(hi-lo)/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const y0=Math.floor(lo/step)*step, y1=Math.ceil(hi/step)*step;
  const X=i=> pts.length===1 ? (L+(W-L-R)/2) : L+(W-L-R)*i/(pts.length-1);
  const Y=v=> T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const svg=sv('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'График: '+yLabel});
  for (let v=y0; v<=y1+1e-9; v+=step){
    svg.append(sv('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    svg.append(sv('text',{x:L-6,y:Y(v)+4,'text-anchor':'end'},Math.round(v*10)/10));
  }
  svg.append(sv('polyline',{points:pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' '),fill:'none',stroke:'var(--steel)','stroke-width':2.5,'stroke-linejoin':'round'}));
  pts.forEach((p,i)=>{ svg.append(sv('circle',{cx:X(i),cy:Y(p.y),r:p.pr?4.5:3,fill:p.pr?'var(--accent)':'var(--steel)'})); });
  const lastI=pts.length-1;
  svg.append(sv('circle',{cx:X(lastI),cy:Y(pts[lastI].y),r:6,fill:'none',stroke:'var(--accent)','stroke-width':2}));
  const lab=i=>{ const d=pd(pts[i].d); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); };
  svg.append(sv('text',{x:X(0),y:H-6,'text-anchor':pts.length===1?'middle':'start'},lab(0)));
  if (pts.length>2) svg.append(sv('text',{x:X(Math.floor(lastI/2)),y:H-6,'text-anchor':'middle'},lab(Math.floor(lastI/2))));
  if (pts.length>1) svg.append(sv('text',{x:X(lastI),y:H-6,'text-anchor':'end'},lab(lastI)));
  return svg;
}

const FRAMES=[['F',0],['P1',90],['B',180],['P2',270]].map(([k,a])=>({k,a}));
function overlaySvg(k){
  const tr='translate('+(2*FIG.cx)+',0) scale(-1,1)';
  const svg=sv('svg',{viewBox:'0 0 '+FIG.W+' '+FIG.H,class:'fov',role:'group','aria-label':k==='F'?'Мышцы, вид спереди':'Мышцы, вид сзади'});
  const heat=sv('g',{class:'hl'}), hit=sv('g',{});
  for (const m of FIG[k]) for (const mir of [false,true]){
    if (m.g){ const h=sv('path',{d:m.d,class:'hp '+heatClass(m.g)}); if (mir) h.setAttribute('transform',tr); heat.append(h); }
    const p=sv('path',{d:m.d,class:'m'+(m.g?'':' n')});
    if (mir) p.setAttribute('transform',tr);
    p.dataset.id=m.id; p.dataset.n=m.n; if (m.g) p.dataset.g=m.g;
    p.setAttribute('aria-label',m.n);
    if (m.g && !mir){ p.setAttribute('tabindex','0'); p.setAttribute('role','button'); }
    p.addEventListener('click',()=>{ if (figMoved){ figMoved=false; return; } selectMuscle(m.g,false,m.n); });
    p.addEventListener('keydown',e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); selectMuscle(m.g,false,m.n); } });
    hit.append(p);
  }
  svg.append(heat,hit); return svg;
}
function frameEl(fd){
  const k=fd.k;
  const fr=document.createElement('div'); fr.className='fr';
  const im=document.createElement('img'); im.src=FIG.fr[k]; im.alt=''; im.draggable=false; fr.append(im);
  if (k==='F'||k==='B') fr.append(overlaySvg(k));
  return fr;
}
function pedestal(){
  const s=sv('svg',{viewBox:'0 0 340 700',class:'ped','aria-hidden':'true'});
  s.append(sv('ellipse',{cx:170,cy:664,rx:150,ry:24,class:'r0'}),sv('ellipse',{cx:170,cy:664,rx:128,ry:19,class:'r1'}),sv('ellipse',{cx:170,cy:664,rx:92,ry:13,class:'r2'}));
  return s;
}
function figLoop(){
  const mod=document.getElementById('model'); if (!mod){ figRaf=0; return; }
  const reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  figAng = reduce ? figTarget : figAng+(figTarget-figAng)*0.14;
  if (Math.abs(figTarget-figAng)<0.04) figAng=figTarget;
  const ang=((figAng%360)+360)%360, n=FRAMES.length;
  let i=0; for (let j=0;j<n;j++) if (FRAMES[j].a<=ang) i=j;
  const nx=(i+1)%n, span=n===1?360:((FRAMES[nx].a-FRAMES[i].a+360)%360)||360;
  const f=(ang-FRAMES[i].a)/span;
  const e=span>50 ? (f<=.2?0:f>=.8?1:(()=>{ const s=(f-.2)/.6; return s*s*(3-2*s); })()) : f;
  const sq=.12*Math.min(1,span/90);
  [...mod.children].forEach((fr,idx)=>{
    let o=0, sx=1;
    if (idx===i){ o=1-e; sx=1-sq*e; } else if (idx===nx){ o=e; sx=1-sq+sq*e; }
    fr.style.opacity=o.toFixed(3); fr.style.transform='scaleX('+sx.toFixed(3)+')'; fr.style.visibility=o<0.01?'hidden':'visible'; fr.classList.toggle('act',o>0.6);
  });
  const settled = figAng===figTarget && !figDrag;
  mod.classList.toggle('live',settled);
  figRaf = (figAng!==figTarget || figDrag) ? requestAnimationFrame(figLoop) : 0;
}
function kick(){ if (!figRaf) figRaf=requestAnimationFrame(figLoop); }
function rotateTo(side){ const base=side==='front'?0:180; figTarget=base+Math.round((figAng-base)/360)*360; kick(); }
function stepRot(d){ figTarget=Math.round(figTarget/45)*45+d*45; kick(); }
function markSel(){ document.querySelectorAll('.m').forEach(p=>p.classList.toggle('sel',p.dataset.g===selMuscle)); }
function selectMuscle(g,rotate,name){
  if (!g){ toast((name||'Эта мышца')+': не входит в твои группы'); return; }
  goEx(g);
}
function dayWord(n){ return n<=0?'сегодня':n===1?'вчера':n+' дн. назад'; }
function fillPanel(){
  const box=document.getElementById('mpanel'); if (!box) return; box.replaceChildren();
  if (!selMuscle){ box.append(el('div',{class:'muted small',text: selName ? selName+': эта мышца пока не входит в твои группы, её нагрузка не считается.' : 'Наведите на мышцу, чтобы увидеть название. Нажмите, и здесь появятся уровень группы и упражнения.'})); return; }
  const G=M.groups[selMuscle];
  const exs=catalogFor(selMuscle).filter(c=>c.cur||c.count>0);
  const shown=panelAll?exs:exs.slice(0,6);
  box.append(
    el('div',{class:'row spread'}, el('h3',{text:selMuscle}), el('span',{class:'rank',text:'уровень '+G.level})),
    (selName&&selName!==selMuscle)?el('div',{class:'small muted',text:'Нажата: '+selName}):null,
    el('div',{class:'bar',style:'margin:8px 0'},el('i',{style:'width:'+Math.round(G.frac*100)+'%'})),
    el('div',{class:'small muted mono',text:Math.round(G.pts).toLocaleString('ru-RU')+' очков · до '+(G.level+1)+' ур. ещё '+Math.max(0,Math.round(G.b-G.pts)).toLocaleString('ru-RU')}),
    el('div',{class:'kpis',style:'margin-top:10px'},
      el('div',{class:'kpi'},el('b',{text:G.last?dayWord(G.days):'—'}),el('span',{text:'последний раз'})),
      el('div',{class:'kpi'},el('b',{text:G.n30}),el('span',{text:'трен. за 30 дней'})),
      el('div',{class:'kpi'},el('b',{text:kg(G.vol30)}),el('span',{text:'тоннаж за 30 дней'}))),
    el('div',{class:'small muted',style:'margin:12px 0 6px'},'Упражнения ('+exs.length+')'),
    el('div',{style:'display:flex;flex-direction:column;gap:6px'}, shown.map(c=>{
      const r=M.ex.get(c.n.toLowerCase());
      return el('button',{class:'pitem',onclick:()=>{ if (!r){ toast('По этому упражнению пока нет записей'); return; } recOpen=r.n.toLowerCase(); tab='records'; location.hash='records'; window.scrollTo(0,0); render(); }},
        el('b',{text:c.n}), el('span',{class:'small muted mono',text:c.sets?(compact(c.sets)+' · '+shortDate(c.last)+(r&&r.bestE>0?' · макс '+Math.round(r.bestE)+' кг':'')):'ещё не выполнялось'}));
    })),

function bindStage(){
  const st=document.getElementById('stage'); if (!st) return;
  const tip=document.getElementById('tip'), wrap=document.getElementById('swrap');
  const hov=(id)=>document.querySelectorAll('.m').forEach(p=>p.classList.toggle('hov',!!id&&p.dataset.id===id));
  let lastX=0, lastT=0, vel=0;
  st.addEventListener('pointerdown',e=>{ figDrag={x:e.clientX,a:figTarget}; figMoved=false; lastX=e.clientX; lastT=performance.now(); vel=0; });
  st.addEventListener('pointermove',e=>{
    if (figDrag){
      const dx=e.clientX-figDrag.x; if (Math.abs(dx)>6) figMoved=true;
      if (figMoved){
        const now=performance.now(), dt=Math.max(1,now-lastT);
        vel=0.8*vel+0.2*(-(e.clientX-lastX)*0.6/dt); lastX=e.clientX; lastT=now;
        figTarget=figAng=figDrag.a-dx*0.6; tip.hidden=true; hov(null); kick();
      }
      return;
    }
    const m=e.target.closest&&e.target.closest('.m');
    if (!m){ tip.hidden=true; hov(null); return; }
    const r=wrap.getBoundingClientRect();
    tip.textContent=m.dataset.n+(m.dataset.g?' · '+m.dataset.g:'');
    tip.hidden=false;
    const w=tip.offsetWidth; let x=e.clientX-r.left+12; if (x+w>r.width) x=e.clientX-r.left-w-12; if (x<0) x=0;
    tip.style.left=x+'px'; tip.style.top=Math.max(0,e.clientY-r.top-34)+'px';
    hov(m.dataset.id);
  });
  const end=()=>{
    if (!figDrag) return; const moved=figMoved; figDrag=null;
    if (moved){
      let tg=figTarget+Math.max(-90,Math.min(90,vel*160));
      const base=Math.round(tg/180)*180; if (Math.abs(tg-base)<20) tg=base;
      figTarget=tg; setTimeout(()=>{ figMoved=false; },60);
    }
    kick();
  };
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
  st.addEventListener('pointerleave',()=>{ tip.hidden=true; hov(null); end(); });
}

/* ---------- EXERCISES TAB ---------- */
let exOpen=null, exOther={};
const GTYPE={'Грудь':'Верх','Спина':'Верх','Бицепс':'Верх','Трицепс':'Верх','Плечи':'Плечи','Ноги':'Низ','Икры':'Низ'};
function goEx(g){
  exOpen=g; tab='ex'; location.hash='ex'; confirmDel=null; render();
  setTimeout(()=>{ const x=document.getElementById('exg-'+g); if (x) x.scrollIntoView({block:'start'}); },0);
}
function doExercise(g,n){
  if (!draft) startDraft(GTYPE[g]||'Верх');
  const have=draft.ex.some(e=>e.n.toLowerCase()===n.toLowerCase());
  if (!have) addEx(g,n);
  tab='train'; location.hash='train'; pick=null; window.scrollTo(0,0); render();
  toast(have?'Уже в тренировке: '+n:'Добавлено в тренировку: '+n);
}
function viewEx(){
  const out=[el('h2',{text:'Упражнения'}), el('p',{class:'muted',style:'margin:0',text:'Откройте группу мышц и нажмите на упражнение, чтобы начать его в тренировке.'})];
  for (const g of GROUPS){
    const open=exOpen===g, G=M.groups[g], all=catalogFor(g), cur=all.filter(c=>c.cur), rest=all.filter(c=>!c.cur);
    const card=el('section',{class:'card exg',id:'exg-'+g},
      el('button',{class:'exh','aria-expanded':open?'true':'false',onclick:()=>{ exOpen=open?null:g; render(); }},
        el('b',{text:g}), el('span',{class:'small muted',text:cur.length+' упр.'}), el('span',{class:'rank',text:'ур. '+G.level}), el('span',{class:'chev','aria-hidden':'true',text:open?'▾':'▸'})));
    if (open){
      const row=c=>{
        const r=M.ex.get(c.n.toLowerCase());
        return el('div',{class:'exrow'},
          el('button',{class:'exname',onclick:()=>doExercise(g,c.n)},c.n),
          r?el('button',{class:'exhist','aria-label':'История: '+c.n,onclick:()=>{ recOpen=r.n.toLowerCase(); tab='records'; location.hash='records'; window.scrollTo(0,0); render(); }},'история'):null);
      };
      card.append(el('div',{class:'exlist'}, cur.map(row)));
      if (rest.length){
        card.append(el('button',{class:'btn sm ghost',style:'margin-top:10px',onclick:()=>{ exOther[g]=!exOther[g]; render(); }}, exOther[g]?'Скрыть другие':'Другие из истории ('+rest.length+')'));
        if (exOther[g]) card.append(el('div',{class:'exlist'}, rest.map(row)));
      }
      const inp=el('input',{type:'text',placeholder:'Своё упражнение',autocomplete:'off',style:'flex:1'});
      card.append(el('div',{class:'row',style:'margin-top:12px'}, inp, el('button',{class:'btn sm',onclick:async()=>{
        const n=inp.value.trim(); if (!n) return;
        if (!all.some(c=>c.n.toLowerCase()===n.toLowerCase())){ profile.custom=(profile.custom||[]).concat([{n,g}]); await saveProfile(); compute(); }
        render(); toast('Добавлено в список: '+n);
      }},'Добавить')));
    }
    out.push(card);
  }
  return out;
}
function viewWorkout(){
  if (!draft){ const d=lsGet(LS_D); if (d && d.ex && PROGRAM[d.t]) draft=d; }
  if (!draft){
    return [el('h2',{text:'Тренировка'}),
      el('p',{class:'muted',style:'margin:0',text:'Выберите день. Упражнения выбираются по блокам: грудь, спина, плечи и так далее.'}),
      TYPES.map(t=>{
        const prev=[...M.sessions].reverse().find(s=>s.t===t);
        return el('button',{class:'card',style:'text-align:left;cursor:pointer',onclick:()=>{ startDraft(t); render(); }},
          el('div',{class:'row spread'}, el('h3',{text:PROGRAM[t].title}), el('span',{class:'small muted',text:prev?'прошлая: '+shortDate(prev.d):'ещё не было'})),
          el('div',{class:'muted small',style:'margin-top:4px',text:PROGRAM[t].note}));
      })];
  }
  const prog=PROGRAM[draft.t];
  const done=draft.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const total=draft.ex.reduce((a,e)=>a+exTonn(e),0);
  const top=el('div',{class:'sticky'}, el('div',{class:'card row spread'},
    el('div',{}, el('b',{text:prog.title}), el('div',{class:'small muted'},pd(draft.d).getDate()+' '+MONTHS[pd(draft.d).getMonth()]+' · подходов '+done), el('div',{class:'mono',style:'font-size:18px'},'Σ '+kg(total))),
    el('div',{class:'row'}, el('button',{class:'btn sm',onclick:()=>startRest(90),'aria-label':'Отдых 90 секунд'},'Отдых 90 с'), el('span',{class:'timer',id:'rest',text:'00:00'}))));
  const groups=prog.blocks.map(b=>b.g);
  const extra=[...new Set((draft.extra||[]).concat(draft.ex.map(e=>e.g)).filter(g=>g&&!groups.includes(g)))];
  const blocks=prog.blocks.concat(extra.map(g=>({g,hint:'добавлено вручную'}))).map(b=>{
    const items=draft.ex.map((e,i)=>[e,i]).filter(([e])=>e.g===b.g);
    const wrap=el('section',{style:'display:flex;flex-direction:column;gap:10px'},
      el('div',{class:'row spread'}, el('div',{}, el('h2',{text:b.g,style:'font-size:24px'}), el('div',{class:'small muted',text:b.hint})),
        el('div',{class:'row'},
          !items.length?el('button',{class:'btn sm ghost',onclick:()=>copyLast(b.g)},'Как в прошлый раз'):null,
          el('button',{class:'btn sm primary',onclick:()=>{ pick=(pick===b.g?null:b.g); pickQuery=''; pickAll=false; render(); }},'+ Упражнение'))),
      pick===b.g?viewPicker(b.g):null,
      items.map(([e,i])=>exCard(e,i)),
      (!items.length && pick!==b.g)?el('div',{class:'small muted',text:b.opt?'Пропущено по желанию':'Упражнения пока не выбраны'}):null);
    return wrap;
  });
  const others=GROUPS.filter(g=>!groups.includes(g)&&!extra.includes(g));
  const more=el('div',{class:'card'}, el('div',{class:'small muted',text:'Добавить другую группу мышц'}),
    el('div',{class:'row',style:'margin-top:8px'}, others.map(g=>el('button',{class:'chip',onclick:()=>{ draft.extra=(draft.extra||[]).concat([g]); pick=g; pickQuery=''; pickAll=false; saveDraft(); render(); }},g))));
  const finish=el('div',{class:'row'},
    el('button',{class:'btn primary',style:'flex:2',onclick:finishWorkout},'Завершить и сохранить'),
    el('button',{class:'btn ghost',style:'flex:1',onclick:()=>{ if (confirmDel==='draft'){ draft=null; lsSet(LS_D,null); confirmDel=null; render(); } else { confirmDel='draft'; render(); toast('Нажмите ещё раз, чтобы отменить тренировку'); } }}, confirmDel==='draft'?'Точно отменить?':'Отменить'));
  return [top, blocks, more, finish];
}
async function finishWorkout(){
  const exs=[];
  for (const e of draft.ex){
    const s=e.sets.filter(x=>x.done).map(x=>[num(x.w)||0, parseInt(x.r,10)]).filter(([w,r])=>r>0&&r<=100&&w>=0);
    if (s.length) exs.push({n:e.n, g:e.g||exGroup(e.n)||'Другое', c:null, s});
  }
  if (!exs.length){ toast('Отметьте галочкой хотя бы один выполненный подход'); return; }
  const before={lv:M.level, xp:M.xp, pr:M.prEvents};
  const id='s'+Date.now();
  const sess={id, d:draft.d, t:draft.t, ex:exs, created:Date.now()};
  try { await saveSession(sess); } catch(e){ toast('Не удалось сохранить. Тренировка осталась в черновике.'); return; }
  draft=null; lsSet(LS_D,null);
  compute();
  const gained=M.xp-before.xp, newPr=M.prEvents-before.pr;
  tab='log'; openSess=id; location.hash='log'; render();
  toast('Сохранено: +'+gained+' XP'+(newPr>0?', новых рекордов: '+newPr:'')+(M.level>before.lv?' · уровень '+M.level+'!':''));
}

/* ---------- HISTORY ---------- */
function viewLog(){
  const chips=el('div',{class:'row'}, ['Все',...TYPES].map(t=>el('button',{class:'chip','aria-pressed':String(logFilter===t),onclick:()=>{ logFilter=t; render(); }},t)));
  const list=[...M.sessions].reverse().filter(s=>logFilter==='Все'||s.t===logFilter);
  const out=[el('h2',{text:'История'}), chips];
  let curMonth='';
  for (const s of list){
    const d=pd(s.d); const mk=MONTHS_N[d.getMonth()]+' '+d.getFullYear();
    if (mk!==curMonth){ curMonth=mk; out.push(el('div',{class:'month',text:mk})); }
    const open=openSess===s.id;
    const prCount=s.ex.reduce((a,e)=>{ const r=M.ex.get(e.n.toLowerCase()); const h=r&&r.hist.find(h=>h.sid===s.id); return a+(h&&h.pr?1:0); },0);
    const card=el('div',{class:'card sess'},
      el('button',{'aria-expanded':String(open),onclick:()=>{ openSess=open?null:s.id; confirmDel=null; render(); }},
        el('div',{class:'date'},el('b',{text:d.getDate()}),el('span',{text:DOW[d.getDay()]})),
        el('div',{class:'meta'}, el('div',{}, el('b',{text:s.t}),' ',prCount?el('span',{class:'pill',text:prCount+' рек.'}):null),
          el('div',{class:'small muted',text:s.ex.length+' упр. · '+s.sets+' подх. · '+kg(s.vol)+' · +'+s.xp+' XP'}))));
    if (open){
      card.append(el('div',{class:'body'},
        s.ex.map(e=>{ const r=M.ex.get(e.n.toLowerCase()); const h=r&&r.hist.find(h=>h.sid===s.id);
          return el('div',{class:'exl'}, el('b',{text:e.n}),' ', h&&h.pr?el('span',{class:'pill',text:'рекорд'}):null,
            el('div',{class:'sets',text:e.s.length?setTxt(e.s):(e.raw||[]).join(' · ')}), e.c?el('div',{class:'small muted',text:e.c}):null); }),
        s.src==='u'? el('div',{style:'margin-top:12px'}, el('button',{class:'btn sm ghost',onclick:async()=>{
            if (confirmDel===s.id){ await removeSession(s.id); confirmDel=null; openSess=null; compute(); render(); toast('Тренировка удалена'); }
            else { confirmDel=s.id; render(); } }}, confirmDel===s.id?'Точно удалить?':'Удалить тренировку')):null));
    }
    out.push(card);
  }
  if (!list.length) out.push(el('div',{class:'muted',text:'Тренировок пока нет.'}));
  return out;
}

/* ---------- RECORDS ---------- */
function viewRecords(){
  if (recOpen){ const r=M.ex.get(recOpen); if (r) return viewExercise(r); recOpen=null; }
  const chips=el('div',{class:'row'}, ['Все',...GROUPS].map(g=>el('button',{class:'chip','aria-pressed':String(recGroup===g),onclick:()=>{ recGroup=g; render(); }},g)));
  const q=el('input',{type:'search',placeholder:'Найти упражнение',value:recQuery,'aria-label':'Поиск упражнения',oninput:ev=>{ recQuery=ev.target.value; renderList(); }});
  const holder=el('div',{id:'reclist',style:'display:flex;flex-direction:column;gap:8px'});
  function renderList(){
    holder.replaceChildren();
    const rows=[...M.ex.values()].filter(r=>(recGroup==='Все'||r.g===recGroup)&&(!recQuery||r.n.toLowerCase().includes(recQuery.toLowerCase())))
      .sort((a,b)=> b.hist[b.hist.length-1].d.localeCompare(a.hist[a.hist.length-1].d) || b.hist.length-a.hist.length);
    for (const r of rows.slice(0,80)){
      const recent=r.hist.some(h=>h.pr&&h.d>=M.cut30);
      const best=r.bestWset?fmtN(r.bestWset[0])+'×'+r.bestWset[1]:(r.bestBW?'×'+r.bestBW:'—');
      holder.append(el('button',{class:'rec',onclick:()=>{ recOpen=r.n.toLowerCase(); window.scrollTo(0,0); render(); }},
        el('div',{class:'nm'}, el('b',{text:r.n}), el('span',{class:'small muted',text:(r.g||'')+' · '+r.hist.length+' трен.'}),' ',recent?el('span',{class:'pill',text:'рекорд'}):null),
        el('div',{class:'big',text:best})));
    }
    if (!rows.length) holder.append(el('div',{class:'muted',text:'Ничего не найдено.'}));
    if (rows.length>80) holder.append(el('div',{class:'small muted',text:'Показаны первые 80, уточните поиск.'}));
  }
  renderList();
  return [el('h2',{text:'Рекорды'}), chips, q, holder];
}
function viewExercise(r){
  const mode = r.bestE>0 ? 'w' : 'bw';
  const pts=r.hist.filter(h=>mode==='w'?h.e1>0:h.bw>0).map(h=>({d:h.d,y:mode==='w'?Math.round(h.e1*10)/10:h.bw,pr:h.pr}));
  const rows=[...r.hist].reverse().slice(0,10);
  const kp=el('div',{class:'kpis'},
    el('div',{class:'kpi'},el('b',{text:r.bestWset?fmtN(r.bestWset[0])+'×'+r.bestWset[1]:'×'+r.bestBW}),el('span',{text:'лучший подход'})),
    el('div',{class:'kpi'},el('b',{text:r.bestE>0?fmtN(r.bestE)+' кг':'—'}),el('span',{text:'расчётный максимум на 1 раз'})),
    el('div',{class:'kpi'},el('b',{text:r.hist.length}),el('span',{text:'тренировок'})),
    el('div',{class:'kpi'},el('b',{text:r.totalSets}),el('span',{text:'подходов'})));
  return [
    el('button',{class:'btn sm ghost',style:'align-self:flex-start',onclick:()=>{ recOpen=null; render(); }},'← Все рекорды'),
    el('div',{}, el('div',{class:'tag',text:r.g||'Другое'}), el('h2',{text:r.n,style:'text-transform:none;overflow-wrap:anywhere'})),
    kp,
    el('div',{class:'card'}, el('div',{class:'row spread'},el('h3',{text:mode==='w'?'Расчётный максимум, кг':'Повторы'}),el('span',{class:'small muted',text:'оранжевые точки — рекорды'})), lineChart(pts, r.n)),
    el('div',{class:'card',style:'overflow-x:auto'}, el('h3',{text:'Последние тренировки',style:'margin-bottom:6px'}),
      el('table',{class:'tbl'}, el('tbody',{}, rows.map(h=>el('tr',{}, el('td',{class:'mono',style:'white-space:nowrap',text:pd(h.d).getDate()+' '+MONTHS[pd(h.d).getMonth()].slice(0,3)}),
        el('td',{class:'mono',text:h.sets.length?setTxt(h.sets):'—'}), el('td',{},h.pr?el('span',{class:'pill',text:'рекорд'}):null))))))
  ];
}

/* ---------- shell ---------- */
const TAB_ICONS={
  hero:['circle:12,8,3.5','M5 20c0-4 3.2-6 7-6s7 2 7 6'],
  ex:['M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'],
  train:['M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11'],
  log:['circle:12,12,9','M12 7v5l3 2'],
  records:['M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M9 20h6']
};
function tabIcon(k){
  const s=sv('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});
  for (const p of TAB_ICONS[k]||[]){
    if (p.startsWith('circle:')){ const [cx,cy,r]=p.slice(7).split(','); s.append(sv('circle',{cx,cy,r})); }
    else s.append(sv('path',{d:p}));
  }
  return s;
}
const TABS=[['hero','Герой'],['ex','Упражнения'],['train','Тренировка'],['log','История'],['records','Рекорды']];
function render(){
  const v=$('#view'); v.replaceChildren();
  const nodes = tab==='hero'?viewHero(): tab==='ex'?viewEx(): tab==='train'?viewWorkout(): tab==='log'?viewLog(): viewRecords();
  v.append(...[nodes].flat(Infinity).filter(Boolean));
  v.style.display='flex'; v.style.flexDirection='column'; v.style.gap='14px';
  const t=$('#tabs'); t.replaceChildren(...TABS.map(([k,l])=>el('button',{class:'tab','aria-current':tab===k?'page':'false',onclick:()=>{ tab=k; location.hash=k; confirmDel=null; window.scrollTo(0,0); render(); }},tabIcon(k),el('span',{text:l}))));
  if (tab==='train') tickTimer();
}
function syncLabel(txt){ const s=$('#sync'); if (s) s.textContent=txt+' · сборка 29.10'; }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if (TABS.some(t=>t[0]===h) && h!==tab){ tab=h; render(); } });

/* ---------- boot ---------- */
(function boot(){
  loadProfile();
  const h=location.hash.slice(1); if (TABS.some(t=>t[0]===h)) tab=h;
  compute(); render();
  syncLabel('на этом устройстве');
  if (TG){ try{ TG.ready(); TG.expand(); document.documentElement.dataset.theme=TG.colorScheme==='light'?'light':'dark'; TG.setHeaderColor(TG.colorScheme==='light'?'#eceff2':'#11151a'); TG.setBackgroundColor(TG.colorScheme==='light'?'#eceff2':'#11151a'); }catch(e){} syncLabel('Telegram'); tgSync(); }
  (async()=>{
    try {
      const api = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!api) return;
      db = api;
      db.collection('sessions').onSnapshot(snap=>{
        dbSessions = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
        compute(); const keep=document.activeElement && document.activeElement.tagName==='INPUT';
        if (!(tab==='train' && keep)) render();
        syncLabel('синхронизировано');
      }, ()=>syncLabel('на этом устройстве'));
      db.doc('profile/main').onSnapshot(snap=>{
        if (snap.exists){ profile=Object.assign(profile, snap.data()); lsSet(LS_P,profile); compute(); const keep=document.activeElement && document.activeElement.tagName==='INPUT'; if (!(tab==='train'&&keep) && !(tab==='hero'&&keep)) render(); }
        else if (lsGet(LS_P)) { db.doc('profile/main').set(profile).catch(()=>{}); }
      }, ()=>{});
      // migrate sessions that were saved locally before the database became available
      const local=lsGet(LS_S)||[];
      if (local.length){ for (const s of local){ try { await db.collection('sessions').doc(s.id).set(s); } catch(e){ return; } } lsSet(LS_S,[]); }
    } catch(e){ /* stay local */ }
  })();
})();
</script>
